[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "shadowdream-rsi"
version = "0.1.0"
requires-python = ">=3.11"
[project.scripts]
shadowdream = "shadowdream.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shadowdream = ["*.yaml"]
